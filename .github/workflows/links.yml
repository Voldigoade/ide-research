name: Scheduled source link check
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_links.py
